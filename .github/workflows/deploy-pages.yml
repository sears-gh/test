name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/setup-strata-engine-dev-TQwp6]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: strata-engine/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: strata-engine
      - name: Build
        run: npm run build
        working-directory: strata-engine
      - name: Push to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd strata-engine/dist
          git init -b gh-pages
          git add index.html
          git commit -m "Deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
