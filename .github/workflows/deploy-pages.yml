name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/setup-strata-engine-dev-TQwp6]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: strata-engine/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: strata-engine
      - name: Build
        run: npm run build
        working-directory: strata-engine
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: strata-engine/dist
      - uses: actions/deploy-pages@v4
        id: deployment
